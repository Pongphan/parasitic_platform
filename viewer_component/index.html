<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0; padding:0 0 8px; background:transparent; color:#243b53;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size:16px;
    }
    .wrap { width:100%; max-width:900px; user-select:none; }
    canvas {
      width:100%; height:auto; aspect-ratio:1; display:block;
      border-radius:16px; background:#e8f0f7;
      box-shadow:0 4px 16px rgba(60,85,110,.12);
      cursor:grab; touch-action:none;
    }
    canvas:active { cursor:grabbing; }
    canvas:focus-visible, button:focus-visible { outline:3px solid #277b98; outline-offset:3px; }
    .toolbar {
      display:flex; flex-wrap:wrap; gap:16px; align-items:center;
      justify-content:space-between; margin-top:14px; padding:14px;
      border:1px solid #cbdce5; border-radius:16px; background:#f5f9fc;
    }
    .summary { flex:1 1 220px; }
    .hint { margin:0 0 12px; font-size:16px; line-height:1.5; color:#465f73; }
    .btn {
      padding:11px 20px; font-size:16px; font-weight:700; color:#17394c;
      background:#c6e9e4; border:1px solid #8ebfb8; border-radius:12px;
      cursor:pointer; transition:background .12s ease,transform .06s ease;
    }
    .btn:hover { background:#b2ded7; }
    .btn:active { transform:translateY(1px); }
    .btn:disabled { cursor:not-allowed; opacity:.6; }
    .controls { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    .ctrl-card {
      background:#edf3fa; border:1px solid #cedce9; border-radius:12px; padding:10px;
    }
    .ctrl-title { font-size:15px; font-weight:700; margin:0 0 8px; text-align:center; }
    .dpad { display:grid; grid-template-columns:repeat(3,40px); grid-template-rows:repeat(3,40px); gap:5px; }
    .icon-btn, .zoom-btn {
      display:flex; align-items:center; justify-content:center;
      width:40px; height:40px; padding:0; border-radius:9px;
      font-size:20px; line-height:1; color:#274b66;
      background:#dce9f7; border:1px solid #adc5dc; cursor:pointer;
    }
    .icon-btn:hover, .zoom-btn:hover { background:#c8dcf1; }
    .center-dot { cursor:default; background:#f5f8fc; color:#7a91a3; }
    .zoom-stack { display:flex; flex-direction:column; align-items:center; gap:7px; }
    .zoom-btn { font-size:22px; font-weight:700; width:46px; }
    .zoom-readout { font-size:15px; font-weight:600; min-width:50px; text-align:center; }
    @media (max-width:520px) {
      .toolbar { justify-content:center; padding:12px; }
      .summary { flex-basis:100%; }
      .btn { width:100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="cv" tabindex="0" role="img" aria-label="Microscopy image with a three by three grid. Position the target inside the center square using pan and zoom controls."></canvas>
    <div class="toolbar">
      <div class="summary">
        <p id="viewerHint" class="hint">Place the target in the center square. Scroll to zoom, drag to pan, or use the buttons.</p>
        <button id="calcBtn" class="btn" type="button" disabled>Calculate</button>
      </div>
      <div class="controls" aria-label="Image controls">
        <div class="ctrl-card">
          <div class="ctrl-title">PAN</div>
          <div class="dpad">
            <div></div><button id="panUpBtn" class="icon-btn" type="button" aria-label="Move image up" title="Move image up">▲</button><div></div>
            <button id="panLeftBtn" class="icon-btn" type="button" aria-label="Move image left" title="Move image left">◀</button>
            <div class="icon-btn center-dot" aria-hidden="true">•</div>
            <button id="panRightBtn" class="icon-btn" type="button" aria-label="Move image right" title="Move image right">▶</button>
            <div></div><button id="panDownBtn" class="icon-btn" type="button" aria-label="Move image down" title="Move image down">▼</button><div></div>
          </div>
        </div>
        <div class="ctrl-card">
          <div class="ctrl-title">ZOOM</div>
          <div class="zoom-stack">
            <button id="zoomInBtn" class="zoom-btn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
            <button id="zoomOutBtn" class="zoom-btn" type="button" aria-label="Zoom out" title="Zoom out">−</button>
            <div id="zoomReadout" class="zoom-readout" aria-live="polite">100%</div>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
  // Keep the logical viewport independent from its responsive CSS display size.
  function sendMessage(type, data){
    window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data), "*");
  }
  function componentReady(){ sendMessage("streamlit:componentReady", {apiVersion:1}); }
  function setFrameHeight(height){ sendMessage("streamlit:setFrameHeight", {height:height}); }
  function setComponentValue(value){ sendMessage("streamlit:setComponentValue", {value:value,dataType:"json"}); }
  function makeCalcToken(){ return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10); }

  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");
  const img = new Image();
  const wrap = document.querySelector(".wrap");
  const calcButton = document.getElementById("calcBtn");
  const zoomReadout = document.getElementById("zoomReadout");
  const hint = document.getElementById("viewerHint");
  const defaultHint = hint.textContent;
  const ZOOM_MIN = .15, ZOOM_MAX = 12;
  let vp = 900, zoom = 1, panX = 0, panY = 0;
  let dragging = false, lastX = 0, lastY = 0;
  let initialized = false, imageId = null, resetToken = null, imageData = "";
  let drawPending = false, lastFrameHeight = 0;

  function clamp(value, min, max){ return Math.max(min, Math.min(max,value)); }
  function finiteNumber(value, fallback){
    const result = Number(value);
    return Number.isFinite(result) ? result : fallback;
  }
  function updateZoomReadout(){ zoomReadout.textContent = `${Math.round(zoom * 100)}%`; }
  function updateFrameHeight(){
    const height = Math.ceil(wrap.getBoundingClientRect().height) + 8;
    if(height !== lastFrameHeight){ lastFrameHeight = height; setFrameHeight(height); }
  }
  function requestDraw(){
    if(drawPending) return;
    drawPending = true;
    requestAnimationFrame(() => { drawPending = false; draw(); updateFrameHeight(); });
  }
  function resizeCanvas(newVp){
    // Scaling pan with the logical viewport keeps the same image-space ROI.
    const ratio = newVp / vp;
    panX *= ratio; panY *= ratio;
    vp = newVp;
    canvas.width = vp; canvas.height = vp;
    wrap.style.maxWidth = `${vp}px`;
    requestDraw();
  }
  function imageReady(){ return img.complete && img.naturalWidth > 0 && img.naturalHeight > 0; }
  function draw(){
    ctx.clearRect(0,0,vp,vp);
    ctx.fillStyle = "#e8f0f7"; ctx.fillRect(0,0,vp,vp);
    if(!imageReady()) return;
    const scale = Math.min(vp/img.naturalWidth,vp/img.naturalHeight) * zoom;
    const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img,vp/2-dw/2+panX,vp/2-dh/2+panY,dw,dh);
    const step = vp/3;
    ctx.save(); ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(165,83,101,.65)";
    for(let i=1;i<=2;i++){
      const p = step*i;
      ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,vp); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(vp,p); ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.lineWidth = 3; ctx.strokeStyle = "#147a8d";
    ctx.fillStyle = "rgba(164,222,223,.10)";
    ctx.beginPath(); ctx.rect(step,step,step,step); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  function zoomAboutScreenPoint(mx,my,factor){
    if(!imageReady()) return;
    const oldZoom = zoom;
    zoom = clamp(zoom*factor,ZOOM_MIN,ZOOM_MAX);
    const ratio = zoom/oldZoom;
    panX = mx-vp/2-(mx-vp/2-panX)*ratio;
    panY = my-vp/2-(my-vp/2-panY)*ratio;
    updateZoomReadout(); requestDraw();
  }
  function panBy(dx,dy){ panX += dx; panY += dy; requestDraw(); }
  function panStep(){ return Math.max(8,Math.round(vp*.06)); }
  function canvasPoint(event){
    const rect = canvas.getBoundingClientRect();
    return {x:(event.clientX-rect.left)*vp/Math.max(1,rect.width),
            y:(event.clientY-rect.top)*vp/Math.max(1,rect.height)};
  }
  function onWheel(event){
    event.preventDefault();
    const point = canvasPoint(event);
    zoomAboutScreenPoint(point.x,point.y,event.deltaY<0 ? 1.08 : .92);
  }
  function onDown(event){
    if(event.button !== undefined && event.button !== 0) return;
    const point = canvasPoint(event);
    dragging = true; lastX = point.x; lastY = point.y;
    canvas.focus({preventScroll:true});
    if(canvas.setPointerCapture){ try{canvas.setPointerCapture(event.pointerId);}catch(_){} }
  }
  function onMove(event){
    if(!dragging) return;
    const point = canvasPoint(event);
    panBy(point.x-lastX,point.y-lastY);
    lastX = point.x; lastY = point.y;
  }
  function onUp(){ dragging = false; }
  canvas.addEventListener("wheel",onWheel,{passive:false});
  canvas.addEventListener("pointerdown",onDown);
  canvas.addEventListener("pointermove",onMove);
  canvas.addEventListener("pointerup",onUp);
  canvas.addEventListener("pointercancel",onUp);
  canvas.addEventListener("lostpointercapture",onUp);
  document.getElementById("panLeftBtn").addEventListener("click",() => panBy(-panStep(),0));
  document.getElementById("panRightBtn").addEventListener("click",() => panBy(panStep(),0));
  document.getElementById("panUpBtn").addEventListener("click",() => panBy(0,-panStep()));
  document.getElementById("panDownBtn").addEventListener("click",() => panBy(0,panStep()));
  document.getElementById("zoomInBtn").addEventListener("click",() => zoomAboutScreenPoint(vp/2,vp/2,1.1));
  document.getElementById("zoomOutBtn").addEventListener("click",() => zoomAboutScreenPoint(vp/2,vp/2,1/1.1));
  window.addEventListener("keydown",event => {
    const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
    if(["input","textarea","select"].includes(tag)) return;
    const step = panStep();
    switch(event.key){
      case "ArrowLeft": event.preventDefault(); panBy(-step,0); break;
      case "ArrowRight": event.preventDefault(); panBy(step,0); break;
      case "ArrowUp": event.preventDefault(); panBy(0,-step); break;
      case "ArrowDown": event.preventDefault(); panBy(0,step); break;
      case "+": case "=": event.preventDefault(); zoomAboutScreenPoint(vp/2,vp/2,1.1); break;
      case "-": case "_": event.preventDefault(); zoomAboutScreenPoint(vp/2,vp/2,1/1.1); break;
    }
  });
  calcButton.addEventListener("click",() => {
    if(!initialized || !imageReady() || calcButton.disabled) return;
    setComponentValue({action:"calculate",calc_token:makeCalcToken(),image_id:imageId,
                       zoom:zoom,panX:panX,panY:panY,viewport:vp});
  });
  img.onload = () => { calcButton.disabled = false; hint.textContent = defaultHint; requestDraw(); };
  img.onerror = () => { calcButton.disabled = true; hint.textContent = "Image could not be displayed. Select the image again."; requestDraw(); };

  function onRender(event){
    if(event.source !== window.parent || !event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    const b64 = String(args.image_b64 || "");
    const nextId = String(args.image_id || b64);
    const nextReset = args.reset_token ?? null;
    const shouldReset = !initialized || nextId !== imageId || nextReset !== resetToken;
    const newVp = clamp(Math.round(finiteNumber(args.viewport,900)),1,4096);
    if(newVp !== vp) resizeCanvas(newVp);
    if(shouldReset){
      zoom = clamp(finiteNumber(args.init_zoom,1),ZOOM_MIN,ZOOM_MAX);
      panX = finiteNumber(args.init_panX,0); panY = finiteNumber(args.init_panY,0);
      dragging = false;
    }
    initialized = true; imageId = nextId; resetToken = nextReset;
    if(imageData !== b64){
      imageData = b64; calcButton.disabled = true;
      img.src = "data:image/png;base64," + b64;
    }
    updateZoomReadout(); requestDraw();
  }
  window.addEventListener("message",onRender);
  window.addEventListener("resize",() => { updateFrameHeight(); requestDraw(); });
  if(typeof ResizeObserver !== "undefined"){
    new ResizeObserver(() => updateFrameHeight()).observe(wrap);
  }
  componentReady(); resizeCanvas(900); updateZoomReadout();
</script>
</body>
</html>
